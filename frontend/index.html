<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Jan Louis Simundo, developer. Building things for the web." />
    <meta name="theme-color" content="#f4f9ff" />
    <meta property="og:title" content="Jan Louis Simundo - Developer" />
    <meta property="og:description" content="Building things for the web." />
    <meta property="og:type" content="website" />
    <title>Jan Louis Simundo - Portfolio</title>
    <script src="src/theme-init.js"></script>
    <script src="src/preload-init.js"></script>
    <style>.preloader{display:none}html.preloading{overflow:hidden}html.preloading .preloader{z-index:100;background:var(--bg);color:var(--text);will-change:transform;transition:transform 1s cubic-bezier(1,.01,.38,1.01);display:block;position:fixed;inset:0;overflow:hidden}.preloader.leaving{transform:translateY(-105%)}.pl-text{z-index:2;text-align:center;flex-direction:column;align-items:center;gap:8px;padding:0 16px;display:flex;position:absolute;top:48%;left:0;right:0;transform:translateY(-50%)}.pl-name{font:800 clamp(64px, 20vw, 220px) / 1 var(--font-sans,Inter, system-ui, sans-serif);letter-spacing:-.05em;justify-content:center;margin:0;display:flex}.pl-ch{animation:.9s cubic-bezier(.16,1,.3,1) both pl-in;animation-delay:calc(var(--i) * 50ms + .1s);display:inline-block}@keyframes pl-in{0%{opacity:.001;filter:blur(10px);transform:translate(200px)scale(3)skewY(3deg)}to{opacity:1;filter:blur();transform:none}}.pl-slogan{width:100%;height:1.4em;font:500 16px / 1.2 var(--font-mono,"JetBrains Mono", ui-monospace, monospace);letter-spacing:-.04em;color:var(--muted);position:relative}.pl-line{white-space:nowrap;margin:0;position:absolute;inset:0}.pl-sc{white-space:pre;opacity:0;transition:transform .2s ease-out,opacity .2s ease-out;transition-delay:calc(var(--i) * 10ms);display:inline-block;transform:translateY(40px)}.pl-line.on .pl-sc{opacity:1;transform:none}.pl-line.out .pl-sc{opacity:0;transform:translateY(-40px)}.pl-glow{z-index:1;filter:blur(57px);width:640px;height:640px;animation:2.2s cubic-bezier(.2,.9,.25,1.04) both pl-glow;position:absolute}.pl-glow.a{--fx:-1200px;background:radial-gradient(60% 91% at 50% 52%, var(--accent2) 0%, transparent 100%);bottom:-300px;left:-300px}.pl-glow.b{--fx:1200px;background:radial-gradient(60% 91% at 50% 52%, var(--accent) 0%, transparent 100%);top:-300px;right:-300px}@keyframes pl-glow{0%{transform:translateX(var(--fx)) scale(1.2)}to{transform:none}}@media (width<=600px){.pl-glow{width:520px;height:520px}.pl-glow.a{bottom:-280px;left:-280px}.pl-glow.b{top:-280px;right:-280px}}</style>
    <link rel="icon" type="image/jpeg" href="assets/images/profile.jpg" />
    <link rel="apple-touch-icon" href="assets/images/profile.jpg" />
    <meta property="og:image" content="https://simundo-portfolio.vercel.app/assets/images/profile.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" />
    <link rel="stylesheet" href="styles/tailwind.css?v=3" />
    <link rel="stylesheet" href="styles/theme.css?v=3" />
  </head>
  <body data-page="home">
    <div id="preloader" class="preloader" aria-hidden="true">
      <div class="pl-glow a"></div>
      <div class="pl-glow b"></div>
      <div class="pl-text">
        <h1 class="pl-name">
          <span class="pl-ch" style="--i: 0">J</span><span class="pl-ch" style="--i: 1">A</span><span class="pl-ch" style="--i: 2">N</span><span class="pl-ch" style="--i: 3">&nbsp;</span><span class="pl-ch" style="--i: 4">L</span><span class="pl-ch" style="--i: 5">O</span><span class="pl-ch" style="--i: 6">U</span><span class="pl-ch" style="--i: 7">I</span><span class="pl-ch" style="--i: 8">S</span>
        </h1>
        <div class="pl-slogan"></div>
      </div>
    </div>
    <!-- Static copy of the top of the hero, readable before JavaScript runs. app.js replaces it. -->
    <div id="root" data-shell>
      <div class="h-[60px] min-[1280px]:h-[66px]"></div>
      <section class="mx-auto flex min-h-[calc(100svh-5rem)] max-w-[1040px] flex-col items-center px-5 pb-10 pt-10 text-center md:pt-14">
        <div class="relative size-24">
          <img src="assets/images/profile.jpg" alt="" width="96" height="96" class="size-full rounded-full border border-border object-cover" />
        </div>
        <h1 class="mt-6 text-[clamp(32px,6vw,56px)] font-bold leading-[1.1] tracking-tight">
          <span class="mr-[0.28em] inline-block">Hi, I'm</span>
          <span class="text-gradient">Jan Louis Simundo</span>
        </h1>
        <p class="mt-3 max-w-xl text-lg text-muted">
          <span class="font-semibold text-text">Developer.</span> Building things for the web.
        </p>
        <div class="mt-6 flex flex-wrap justify-center gap-3">
          <a href="mailto:simundojanlouis@gmail.com" class="inline-flex items-center justify-center gap-2 rounded-full bg-accent px-5 py-2 text-sm font-semibold text-accent-contrast">Email me</a>
        </div>
      </section>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollTrigger.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/ScrollToPlugin.min.js" defer></script>
    <script src="src/icons.js" defer></script>
    <script src="src/content.js?v=3" defer></script>
    <script src="src/app.js?v=4" defer></script>
    <script src="src/preloader.js" defer></script>
  </body>
</html>
