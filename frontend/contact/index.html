    <style>.preloader{display:none}html.preloading{overflow:hidden}html.preloading .preloader{z-index:100;background:var(--bg);color:var(--text);will-change:transform;transition:transform 1s cubic-bezier(1,.01,.38,1.01);display:block;position:fixed;inset:0;overflow:hidden}.preloader.leaving{transform:translateY(-105%)}.pl-text{z-index:2;text-align:center;flex-direction:column;align-items:center;gap:8px;padding:0 16px;display:flex;position:absolute;top:48%;left:0;right:0;transform:translateY(-50%)}.pl-name{font:800 clamp(64px, 20vw, 220px) / 1 var(--font-sans,Inter, system-ui, sans-serif);letter-spacing:-.05em;justify-content:center;margin:0;display:flex}.pl-ch{animation:.9s cubic-bezier(.16,1,.3,1) both pl-in;animation-delay:calc(var(--i) * 50ms + .1s);display:inline-block}@keyframes pl-in{0%{opacity:.001;filter:blur(10px);transform:translate(200px)scale(3)skewY(3deg)}to{opacity:1;filter:blur();transform:none}}.pl-slogan{width:100%;height:1.4em;font:500 16px / 1.2 var(--font-mono,"JetBrains Mono", ui-monospace, monospace);letter-spacing:-.04em;color:var(--muted);position:relative}.pl-line{white-space:nowrap;margin:0;position:absolute;inset:0}.pl-sc{white-space:pre;opacity:0;transition:transform .2s ease-out,opacity .2s ease-out;transition-delay:calc(var(--i) * 10ms);display:inline-block;transform:translateY(40px)}.pl-line.on .pl-sc{opacity:1;transform:none}.pl-line.out .pl-sc{opacity:0;transform:translateY(-40px)}.pl-glow{z-index:1;filter:blur(57px);width:640px;height:640px;animation:2.2s cubic-bezier(.2,.9,.25,1.04) both pl-glow;position:absolute}.pl-glow.a{--fx:-1200px;background:radial-gradient(60% 91% at 50% 52%, var(--accent2) 0%, transparent 100%);bottom:-300px;left:-300px}.pl-glow.b{--fx:1200px;background:radial-gradient(60% 91% at 50% 52%, var(--accent) 0%, transparent 100%);top:-300px;right:-300px}@keyframes pl-glow{0%{transform:translateX(var(--fx)) scale(1.2)}to{transform:none}}@media (width<=600px){.pl-glow{width:520px;height:520px}.pl-glow.a{bottom:-280px;left:-280px}.pl-glow.b{top:-280px;right:-280px}}</style>
