<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Jan Louis Simundo</title>
<meta name="description" content="Get in touch with Jan Louis Simundo.">
<meta name="theme-color" content="#e0f2fe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles/main.css">
</head>
<body data-page="contact">
<main id="main">

<section class="section"><div class="wrap">
  <div class="page-head"><span class="eyebrow" data-hero>Contact</span><h1 class="h2" data-split style="font-size:clamp(40px,7vw,76px)">Let&rsquo;s work <em>together</em></h1>
  <p class="lead" data-hero>Have an opportunity, a question or just want to say hi? The best way to reach me is email.</p></div>
  <div class="contact-grid">
    <div class="card contact-info" data-reveal>
      <div class="info-row"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m3 8 9 6 9-6"/></svg></span><div><small>Email</small><b>jsimundo@usa.edu.ph</b></div></div>
      <div class="info-row"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m2 9 10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg></span><div><small>School</small><b>University of San Agustin</b></div></div>
      <div class="info-row"><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-5 4 5 4"/><path d="m16 8 5 4-5 4"/><path d="m14 5-4 14"/></svg></span><div><small>Focus</small><b>Frontend development</b></div></div>
      <div style="display:flex;gap:12px;flex-wrap:wrap"><a class="btn btn-primary" href="mailto:jsimundo@usa.edu.ph">Email me</a><button class="btn btn-ghost" type="button" data-copy>Copy email</button></div>
    </div>
    <form class="card form" data-reveal="0.1" autocomplete="on">
      <div class="field"><input id="n" name="name" placeholder=" " required><label for="n">Your name</label></div>
      <div class="field"><input id="e" name="email" type="email" placeholder=" " required><label for="e">Your email</label></div>
      <div class="field"><input id="s" name="subject" placeholder=" "><label for="s">Subject</label></div>
      <div class="field"><textarea id="m" name="message" rows="5" placeholder=" " required></textarea><label for="m">Message</label></div>
      <button class="btn btn-primary" type="submit">Send message <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg></button>
    </form>
  </div>
</div></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="src/main.js"></script>
</body>
</html>
